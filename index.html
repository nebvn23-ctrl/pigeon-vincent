  addEventListener('touchmove', e => { if (ty == null || lbOpen() || !APP.introDone) return; const y = e.touches[0].clientY; APP.Pt = clamp(APP.Pt + (ty - y) * .0024, 0, NCH - .001); ty = y; APP.lastIn = APP.time; }, { passive: true }); addEventListener('touchend', () => ty = null);
  addEventListener('keydown', e => { unlockAudio(); if (e.key === 'Escape') closeLB(); if (!APP.introDone) { if (e.key === ' ' || e.key === 'Enter') finishIntro(); return; } if (e.key === 'ArrowDown' || e.key === 'PageDown') APP.Pt = clamp(APP.Pt + .25, 0, NCH - .001); if (e.key === 'ArrowUp' || e.key === 'PageUp') APP.Pt = clamp(APP.Pt - .25, 0, NCH - .001); APP.lastIn = APP.time; });
  canvas.addEventListener('pointerdown', e => { unlockAudio(); down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', e => { if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) return; down = null; m.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(m, WORLD.camera);
    const h = ray.intersectObjects(WORLD.clickables.map(c => c.obj).filter(o => o.visible && isShown(o)), false); if (!h.length) return; const c = WORLD.clickables.find(c => c.obj === h[0].object); if (c.kind === 'reel') openReel(c.idx); if (c.kind === 'poster') openPoster(c.idx); });
  canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; m.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(m, WORLD.camera); const h = ray.intersectObjects(WORLD.clickables.map(c => c.obj).filter(isShown), false); canvas.style.cursor = h.length ? 'pointer' : 'default'; }); }
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }

/* ───────── loop ───────── */
const CAM = { pos: V(0, 0, -38), look: V(0, 0, -30), roll: 0 };
let COMPOSER, FINAL, IRIS, lastNow = 0;
function step(rdt) { const dt = rdt; APP.time += dt; const t = APP.time;
  if (!APP.introDone) updateIntro(dt);
  // gentle settle: when the visitor stops, glide to the middle of the current scene so every shot lands
  if (APP.introDone && APP.time - APP.lastIn > 1.2) { const k = Math.floor(APP.Pt), u = APP.Pt - k; if (u < .06) APP.Pt = damp(APP.Pt, k + .08, 1.5, dt); else if (u > .94 && k < NCH - 1) APP.Pt = damp(APP.Pt, k + 1.08, 1.5, dt); }
  APP.P = damp(APP.P, APP.Pt, 2.2, dt); const P = APP.P, k = Math.min(NCH - 1, Math.floor(P)), u = P - k;
  if (k !== APP.ch) { APP.ch = k; F.ch.forEach((c, i) => c.g.visible = i === k); if (APP.introDone) { stab(); SFX.shot(); } setCredit(F.ch[k].credit); $('#strip').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === k)); $('#final').classList.toggle('show', false); }
  const S = F.ch[k], shot = S.update(u, t, dt); CAM.pos.copy(shot.pos); CAM.look.copy(shot.look); CAM.roll = shot.roll || 0;
  const cam = WORLD.camera; cam.position.copy(CAM.pos); FX.trauma = Math.max(0, FX.trauma - dt * 1.4); const sh = FX.trauma * FX.trauma; cam.position.x += (vnoise(t * 18, 1) - .5) * sh * .5; cam.position.y += (vnoise(t * 18, 7) - .5) * sh * .5; cam.lookAt(CAM.look); cam.rotation.z += CAM.roll;
  cam.fov = damp(cam.fov, 40 + Math.min(14, Math.abs(APP.P - APP.Pt) * 26), 4, dt); if (Math.abs(APP.P - APP.Pt) > .15) FX.trauma = Math.max(FX.trauma, .18); cam.updateProjectionMatrix();
  // iris between scenes
  if (APP.introDone) { const open = (k === 0 ? 1 : smooth(0, .07, u)) * (k === NCH - 1 ? 1 : smooth(1, .93, u)); IRIS.uniforms.uOpen.value = open * .999 + .001; }
  IRIS.uniforms.uT.value = t; $('#final').classList.toggle('show', k === NCH - 1 && u > .45); $('#hint').classList.toggle('hidden', !APP.introDone || P > .4);
  $('#credit').style.opacity = APP.introDone ? (smooth(.1, .2, u) * (1 - smooth(.8, .9, u))) : 0;
  updateExtras(k, u, t, dt, Math.abs(APP.P - APP.Pt) * 2.6); updateFX(dt); scoreTick(dt);
  const Hb = WORLD.renderer.getDrawingBufferSize(new THREE.Vector2()).y, sc = cam.projectionMatrix.elements[5] * Hb / 2; FX.systems.forEach(s => s.mat.uniforms.uScale.value = sc); EX.motes.material.uniforms.uScale.value = sc; WORLD.scene.traverseVisible && 0; F.ch.forEach(c => c.g.traverse(o => { if (o.material && o.material.uniforms && o.material.uniforms.uScale) o.material.uniforms.uScale.value = sc; }));
  FX.flash = damp(FX.flash, 0, 6, dt);
  if (FINAL) { const uu = FINAL.uniforms; uu.uTime.value = t; uu.uSpeed.value = damp(uu.uSpeed.value, Math.min(1, Math.abs(APP.P - APP.Pt) * 3), 6, dt); uu.uAberr.value = .15 + uu.uSpeed.value * .8; uu.uFlash.value = FX.flash; uu.uGlitch.value = 0; uu.uHeat.value = 0; uu.uVig.value = 1.35; uu.uShockAmp.value = 0; uu.uTint.value.set(1.02, 1, .97); }
  if (window.__NORENDER) return; if (COMPOSER) COMPOSER.render(); else WORLD.renderer.render(WORLD.scene, cam); }
function setCredit(txt) { const el = $('#credit'); el.textContent = txt; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
function loop(now) { requestAnimationFrame(loop); const rdt = Math.min(.05, Math.max(.001, (now - (lastNow || now)) / 1000)); lastNow = now; step(rdt); }
function onResize() { const r = WORLD.renderer, w = innerWidth, h = innerHeight; r.setSize(w, h, false); WORLD.camera.aspect = w / h; WORLD.camera.updateProjectionMatrix(); if (COMPOSER) { COMPOSER.setSize(w, h); FINAL.uniforms.uRes.value.set(w, h); IRIS.uniforms.uRes.value.set(w, h); } }

/* ───────── boot ───────── */
let SPR;
function loadGLB(url) { return new Promise((res, rej) => { if (!THREE.GLTFLoader) return rej('no loader'); new THREE.GLTFLoader().load(url, g => { let geo = null; g.scene.traverse(o => { if (o.isMesh && !geo) geo = o.geometry; }); res(geo); }, undefined, rej); }); }
function failGL(e) { console.warn('WebGL unavailable', e); document.body.classList.add('nogl'); $('#skip').classList.add('hidden'); buildDOM(); ['#bar'].forEach(s => $(s).classList.remove('hidden')); $('#final').classList.add('show'); }
async function boot() { const canvas = $('#gl'); if (!window.THREE) return failGL('no three');
  try { initRenderer(canvas); } catch (e) { return failGL(e); }
  const r = WORLD.renderer; r.toneMappingExposure = 1.05; WORLD.scene.background = new THREE.Color(0x050506); WORLD.scene.fog = null; WORLD.camera.near = .05; WORLD.camera.far = 400; WORLD.camera.updateProjectionMatrix();
  if (document.fonts && document.fonts.load && !ENV.test) { try { await Promise.race([Promise.all([document.fonts.load('400 64px "Cinzel"'), document.fonts.load('500 16px "Inter Tight"')]), new Promise(r => setTimeout(r, 1800))]); } catch (e) { } }
  SPR = makeSprites(); makeConcrete.cached = makeConcrete(); initMaterials({ concrete: makeConcrete.cached, hazard: makeHazard(), sprites: SPR }); initFX(WORLD.scene, SPR);
  let geo; try { geo = await loadGLB(CONFIG.GLB); } catch (e) { console.warn('GLB failed', e); geo = new THREE.CylinderGeometry(.25, .3, 1, 24).translate(0, .5, 0); }
  geo.computeVertexNormals(); F.vin = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 18, specular: 0x222222 })); F.vin.castShadow = true;
  buildFilm(); buildGlobalFX(); buildExtras(); F.ch.forEach((c, i) => c.g.visible = i === 0);
  try { if (THREE.EffectComposer && THREE.UnrealBloomPass) { const rt = new THREE.WebGLRenderTarget(innerWidth * ENV.pr, innerHeight * ENV.pr, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.UnsignedByteType });
      COMPOSER = new THREE.EffectComposer(r, rt); COMPOSER.setPixelRatio(ENV.pr); COMPOSER.setSize(innerWidth, innerHeight); COMPOSER.addPass(new THREE.RenderPass(WORLD.scene, WORLD.camera)); COMPOSER.addPass(new THREE.ShaderPass(SanitizeShader));
      COMPOSER.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), ENV.mobile ? .5 : .65, .5, .82)); FINAL = new THREE.ShaderPass(FinalShader); FINAL.uniforms.uRes.value.set(innerWidth, innerHeight); COMPOSER.addPass(FINAL);
      IRIS = new THREE.ShaderPass(IrisShader); IRIS.uniforms.uRes.value.set(innerWidth, innerHeight); COMPOSER.addPass(IRIS); } } catch (e) { COMPOSER = null; FINAL = null; }
  if (!IRIS) IRIS = { uniforms: { uOpen: { value: 1 }, uT: { value: 0 }, uRes: { value: new THREE.Vector2() } } };
  buildDOM(); $('#skip').onclick = () => { unlockAudio(); finishIntro(); }; $('#sound').onclick = unlockAudio; addEventListener('resize', onResize); initInput(canvas);
  window.__BAG = { step, APP, F, finishIntro, setP(p) { APP.P = APP.Pt = p; APP.lastIn = 1e9; } };
  if (!ENV.test) requestAnimationFrame(loop); window.__BAG_READY = true; }
boot();


</script>
